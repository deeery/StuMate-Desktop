<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="StuMate">
  <title>StuMate 应用图标 v2.2</title>
  <desc>圆角方块 + 课表九宫格 + 高亮待提醒课格 + Lucide 铃铛。深色主题配色。</desc>
  <defs>
    <!-- 外轮廓：圆角方块。半径 118/512 ≈ 23%，与旧版 26dp 方块上的 6dp 圆角同比例 -->
    <clipPath id="smTileV22">
      <path d="M118 0 H394 A118 118 0 0 1 512 118 V394 A118 118 0 0 1 394 512 H118 A118 118 0 0 1 0 394 V118 A118 118 0 0 1 118 0 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#smTileV22)">
    <!-- 底色 = Windows 11 深色强调色（与截图实测 rgb(96,205,255) 一致） -->
    <rect width="512" height="512" fill="#60CDFF"/>

    <!-- 课表九宫格：8 个时间格（右上角那格是待提醒的，单独画） -->
    <g fill="#003A5C" fill-opacity="0.18">
      <rect x="88"  y="88"  width="96" height="96" rx="24"/>
      <rect x="208" y="88"  width="96" height="96" rx="24"/>
      <rect x="88"  y="208" width="96" height="96" rx="24"/>
      <rect x="208" y="208" width="96" height="96" rx="24"/>
      <rect x="328" y="208" width="96" height="96" rx="24"/>
      <rect x="88"  y="328" width="96" height="96" rx="24"/>
      <rect x="208" y="328" width="96" height="96" rx="24"/>
      <rect x="328" y="328" width="96" height="96" rx="24"/>
    </g>

    <!-- 待提醒的课格：右上角实心琥珀 -->
    <rect x="328" y="88" width="96" height="96" rx="24" fill="#FFB900"/>

    <!--
      提醒铃铛 —— Lucide `bell` 原版描边样式（ISC，Copyright (c) 2026 Lucide Icons and Contributors）。
      两条 path 与描边参数（stroke-width 2 / round cap+join / fill=none）全部照搬原图，未改形状。
      group 变换 = Lucide 24×24 空间 → 512 画布：
        scale 12.6    → 视觉外接框宽 245（描边版视觉分量轻，比 v2.1 的 236 放大一点）
        translate     → 视觉外接框中心 (12.001, 12) 移到画布中心 (256, 256)，落位 x 133→379、y 117→395
    -->
    <g transform="translate(104.79,104.8) scale(12.6)" fill="none" stroke="#003A5C"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
      <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
    </g>
  </g>
</svg>

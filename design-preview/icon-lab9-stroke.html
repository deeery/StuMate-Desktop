<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lucide 描边铃铛 · 最终尺寸比选 lab9</title>
<style>
  :root{--bg:#1b1b1b;--panel:#242424;--line:#3a3a3a;--fg:#e8e8e8;--fg3:#7a7a7a;--accent:#60CDFF}
  *{box-sizing:border-box}
  body{margin:0;padding:20px 18px 36px;background:var(--bg);color:var(--fg);font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  h1{font-size:17px;margin:0 0 3px;font-weight:600}
  .sub{color:var(--fg3);font-size:11.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
  .vrow{margin:10px 0 3px;font-size:12.5px;font-weight:600}
  .vrow span{font-weight:400;color:var(--fg3);margin-left:8px}
  .row{display:flex;gap:12px;flex-wrap:nowrap;align-items:flex-end}
  .cell{text-align:center}
  .cell .cap{font-size:10px;color:var(--fg3);margin-top:3px}
  canvas{display:block;background:#272727;border-radius:3px}
  .ref{display:flex;gap:18px;align-items:center;margin:6px 0 2px}
  .ref img{border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<h1>Lucide 描边铃铛 · 最终尺寸比选</h1>
<div class="sub">lab9 · 原样描边（stroke-width 2 / round cap+join），只比缩放系数</div>

<div class="card">
  <div class="vrow">用户参考图（Lucide 原版）</div>
  <div class="ref">
    <img src="../../Pictures/Screenshots/%E5%B1%8F%E5%B9%95%E6%88%AA%E5%9B%BE%202026-10-01%20021320.png" width="150" alt="参考">
    <img src="../../Pictures/Screenshots/%E5%B1%8F%E5%B9%95%E6%88%AA%E5%9B%BE%202026-10-01%20021320.png" width="420" alt="参考放大" style="image-rendering:pixelated">
  </div>
</div>

<div class="card" id="dark"></div>
<div class="card light" id="light"></div>

<script>
const INK_D="#003A5C", TILE_D="#60CDFF", INK_L="#FFFFFF", TILE_L="#0067C0";
const TILEP='M118 0 H394 A118 118 0 0 1 512 118 V394 A118 118 0 0 1 394 512 H118 A118 118 0 0 1 0 394 V118 A118 118 0 0 1 118 0 Z';

// ── Lucide bell 原版 path（24 viewBox，stroke-width 2，round cap+join）──
const L_BODY    = "M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326";
const L_CLAPPER = "M10.268 21a2 2 0 0 0 3.464 0";

// 视觉外接框（含 2 单位描边各外扩 1）：x 2.262→21.74（19.478），y 1→23（22），中心 (12.001,12)
const S_OPTS = [
  { s:12.116, name:"尺寸 A", desc:"视觉宽 236 · 与 v2.1 等宽" },
  { s:12.600, name:"尺寸 B", desc:"视觉宽 245 · 略放大补回描边损失的视觉分量" },
  { s:13.100, name:"尺寸 C", desc:"视觉宽 255 · 再放大一档" },
];
function xf(s){ return `translate(${(256-s*12.001).toFixed(2)},${(256-s*12).toFixed(2)}) scale(${s})`; }

function lucide(ink){
  return `<g transform="${xf(arguments[0])}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${L_CLAPPER}"/><path d="${L_BODY}"/></g>`;
}
const VARIANTS = S_OPTS.map(o => ({
  name:o.name, desc:o.desc,
  bell: ink => `<g transform="${xf(o.s)}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${L_CLAPPER}"/><path d="${L_BODY}"/></g>`
}));

const SMALL=[26,32,48,64], Z=6, LARGE=[128];
let uid=0;
function grid(ink, op){
  let g="";
  [88,208,328].forEach(y=>[88,208,328].forEach(x=>{
    if(x===328&&y===88)return;
    g+=`<rect x="${x}" y="${y}" width="96" height="96" rx="24" fill="${ink}" fill-opacity="${op}"/>`;
  }));
  return g;
}
function svgString(ink,bg,op,bellFn){
  const id="cp"+(uid++);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs><clipPath id="${id}"><path d="${TILEP}"/></clipPath></defs>
    <g clip-path="url(#${id})">
      <rect width="512" height="512" fill="${bg}"/>${grid(ink,op)}
      <rect x="328" y="88" width="96" height="96" rx="24" fill="#FFB900"/>
      ${bellFn(ink)}
    </g></svg>`;
}
function raster(str, px){
  return new Promise(res=>{
    const url=URL.createObjectURL(new Blob([str],{type:"image/svg+xml"}));
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas"); c.width=px; c.height=px;
      c.getContext("2d").drawImage(img,0,0,px,px);
      URL.revokeObjectURL(url); res(c);
    };
    img.src=url;
  });
}
function upscale(src,z){
  const c=document.createElement("canvas");
  c.width=src.width*z; c.height=src.height*z;
  const x=c.getContext("2d"); x.imageSmoothingEnabled=false;
  x.drawImage(src,0,0,c.width,c.height);
  return c;
}
async function render(el, ink, bg, op){
  for(const v of VARIANTS){
    const head=document.createElement("div");
    head.className="vrow"; head.innerHTML=`${v.name}<span>${v.desc}</span>`;
    el.appendChild(head);
    const row=document.createElement("div"); row.className="row"; el.appendChild(row);
    for(const s of SMALL){
      const cell=document.createElement("div"); cell.className="cell";
      cell.appendChild(upscale(await raster(svgString(ink,bg,op,v.bell), s), Z));
      const cap=document.createElement("div"); cap.className="cap"; cap.textContent=s+"dp";
      cell.appendChild(cap); row.appendChild(cell);
    }
    for(const s of LARGE){
      const cell=document.createElement("div"); cell.className="cell";
      cell.appendChild(upscale(await raster(svgString(ink,bg,op,v.bell), s), 1));
      const cap=document.createElement("div"); cap.className="cap"; cap.textContent=s+"dp";
      cell.appendChild(cap); row.appendChild(cell);
    }
  }
}
render(document.getElementById("dark"),  INK_D, TILE_D, 0.18);
render(document.getElementById("light"), INK_L, TILE_L, 0.20);
</script>
</body>
</html>
